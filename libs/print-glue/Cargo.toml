[package]
name = "sc-print-glue"
version = "0.1.0"
edition.workspace = true
license-file = "LICENSE.md"
authors = ["Sleptic"]
description = "Application-layer glue projecting a resolved print configuration onto the slicing engine's input port."
categories = ["data-structures"]
keywords = ["3d", "printing", "resin", "sla", "slicing"]

[lints]
workspace = true

[dependencies]
