# Asks every pull request's authors to sign the Contributor License
# Agreement (CLA.md) and blocks merging until they have. Signatures are
# recorded on the `cla-signatures` branch, so they never touch `main`.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check the CLA
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Sleptic CLA version 2.0 and I hereby sign it') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          custom-pr-sign-comment: I have read the Sleptic CLA version 2.0 and I hereby sign it
          path-to-signatures: signatures/cla-v2.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          # The project's owner and automated accounts do not sign.
          allowlist: ${{ github.repository_owner }},dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, please
            read the [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by posting the comment below. You only need to sign once.
